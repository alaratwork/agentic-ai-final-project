capability: staff
purpose: Returns the directory entry for a Verrin Coast Authority staff member.
inputs:
  - {name: staff_id, fact: "staff_id (S followed by four digits)"}
outputs:
  - {name: name, fact: "name (full name)"}
  - {name: department, fact: "department (department name)"}
  - {name: office, fact: "office (office town)"}
  - {name: extension, fact: "extension (phone extension)"}
scope:
  - "Verrin Coast Authority staff only."
