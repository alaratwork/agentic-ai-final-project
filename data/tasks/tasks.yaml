# file:     data/tasks/tasks.yaml
# project:  judging a tool by its cover (group 9, tokens)
# course:   agentic ai
# author:   alara hakki
# purpose:  task set - one tool call, one graded field, eight per capability
# updated:  2026-11-20

# rules
#   expected answers are never stored here; the grader computes them as
#   cap.answer(cap.lookup(**args), field) so world edits cannot drift
#   every prompt states its args verbatim, so failures are tool choice,
#   not argument formatting
#   quote every date - unquoted yyyy-mm-dd loads as a datetime.date

version: 1
# changed 2026-11-22 (archit) - the grader reads only
# the FINAL line, so the instruction asks for it instead of a bare reply
answer_instruction: >-
  Use the tools to answer. End your reply with one line of the form
  FINAL: <value>, giving only the value in the unit or format the question
  asks for.

tasks:
